name: Docs integrity

on:
  pull_request:
    paths:
      - "docs/**"
      - "assets/**"
      - "scripts/fix_docs_svgs.py"
      - "scripts/check_docs_links.py"
      - ".github/workflows/docs-integrity.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "assets/**"
      - "scripts/fix_docs_svgs.py"
      - "scripts/check_docs_links.py"
      - ".github/workflows/docs-integrity.yml"

permissions:
  contents: read

jobs:
  links-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require portable SVG references
        run: python scripts/fix_docs_svgs.py --check
      - name: Validate documentation links and SVG files
        run: python scripts/check_docs_links.py
