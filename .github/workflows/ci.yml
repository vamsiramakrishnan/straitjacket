name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: built wheel (self-contained)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build

      - name: Validate source distribution and smoke-test installed wheel
        run: python scripts/check_distribution.py dist/*.whl dist/*.tar.gz

  test:
    name: full (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install opportunistic engine binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep universal-ctags

      - name: Install package with all extras
        run: |
          pip install -e '.[dev,map,fast,code,scip]'
          pip install jedi

      - name: Run acceptance suite
        run: python -m pytest tests/ -q

  native:
    name: native hook parity (Rust ↔ Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ubuntu-latest ships a stable Rust toolchain; build the post-tool-use
      # shim so the byte-identical parity suite actually runs. Until now this
      # suite skipped in every CI run (the binary was never built), so the two
      # implementations could silently diverge on shared engagement.json state
      # and the nudge strings. This job makes the claimed parity invariant real.
      - name: Build the native hook shim
        run: cargo build --release --manifest-path native/ctx-hook-native/Cargo.toml

      - name: Install package (dev extra only)
        run: pip install -e '.[dev]'

      - name: Assert the native shim is byte-identical to Python
        env:
          CTX_REQUIRE_NATIVE: "1"  # a missing binary is a failure here, not a skip
        run: python -m pytest tests/test_native_hook.py -q

  minimal:
    name: minimal (py3.11, builtin engines, stdlib fallbacks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately NO ripgrep, NO universal-ctags, NO optional extras:
      # this job proves the deterministic-fallback story. The env pins
      # force the builtin engines even if a binary happens to be present.
      - name: Install package (dev extra only)
        run: pip install -e '.[dev]'

      - name: Run acceptance suite on builtin engines
        env:
          CTX_SEARCH_ENGINE: python
          CTX_MAP_ENGINE: builtin
          CTX_CODE_ENGINE: ast
        run: python -m pytest tests/ -q
