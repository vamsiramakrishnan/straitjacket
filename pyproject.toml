[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctx-harness"
dynamic = ["version"]
description = "straitjacket: artifact-backed, repository-aware context containment harness for Antigravity. Unbounded tool output becomes an immutable artifact plus a bounded deterministic digest."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "straitjacket contributors" }]
keywords = ["antigravity", "context", "agent", "harness", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The PreToolUse hook hot path stays stdlib-only (hook.py imports no third-
# party code). pathspec is a small pure-Python dep used off the hot path for
# correct gitignore-semantics matching; ripgrep is used opportunistically at
# runtime when present on PATH (never required).
dependencies = ["pathspec>=0.12"]

[project.urls]
Homepage = "https://github.com/vamsiramakrishnan/straitjacket"
Repository = "https://github.com/vamsiramakrishnan/straitjacket"
Changelog = "https://github.com/vamsiramakrishnan/straitjacket/blob/main/CHANGELOG.md"

[project.scripts]
ctx = "ctx.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]
map = ["grimp>=3.15", "networkx>=3.4"]
fast = ["orjson>=3"]
# Pillow decodes images for dHash comparison and enriches formats whose
# dimensions are not parsed by the stdlib floor. Binary identity, magic-byte
# detection, common image dimensions, and PDF structure remain dependency-free.
image = ["pillow>=10"]
# Individual grammar wheels are the maintained, offline-safe tree-sitter
# path (the bundle language-pack fetches parsers at runtime); the skeleton
# tier tries these first, then the bundles. SCIP xref ingestion is
# opportunistic: `scip` (protobuf) reads an index.scip when present.
#
# Floors track the versions actually exercised in CI rather than the oldest
# release that once worked. The previous floors (tree-sitter>=0.22 against
# 0.26, ast-grep-py>=0.37 against 0.45) permitted resolving an install two
# API generations behind what any test covers — a combination nothing in
# this repo has ever run.
code = ["jedi>=0.20", "tree-sitter>=0.25", "tree-sitter-python>=0.25",
        "tree-sitter-javascript>=0.25", "tree-sitter-typescript>=0.23",
        "tree-sitter-go>=0.25", "tree-sitter-rust>=0.24",
        "ast-grep-py>=0.45"]
# The vendored scip_pb2 is generated with protoc 3.20 so it remains compatible
# with the protobuf 5.x+ runtimes exercised in CI and does not force upgrades
# that conflict with Google client libraries. A
# mismatched/absent runtime raises on import and the ingester degrades to
# None — SCIP is skipped, never an error.
scip = ["protobuf>=5.26"]
# Semantic/taint plan operators (docs/EVIDENCE-PLANS.md P3). Invoked
# hermetically (local rules, --metrics=off, no registry fetch); absence is
# a declared skip, never an error.
sem = ["semgrep>=1.60"]

[tool.hatch.build.targets.wheel]
packages = ["src/ctx"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/antigravity" = "ctx/data/antigravity"
"plugins/codex" = "ctx/data/codex"
"contrib/ctx-agy/ctx_agy.py" = "ctx/data/ctx_agy.py"
"src/ctx/data/model-prices.json" = "ctx/data/model-prices.json"

[tool.hatch.build.targets.sdist]
include = ["src/ctx", "plugins", "contrib/ctx-agy", "README.md", "LICENSE"]

[tool.hatch.version]
path = "src/ctx/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Keep the documented bare `pytest` command equivalent to `python -m pytest`.
# Console-script launchers otherwise omit the repository root on some managed
# Python installs, breaking imports of the intentionally unshipped eval corpus.
pythonpath = [".", "src"]
markers = [
    "sj_canary: Tier-0 evidence-channel conformance tests (evals/BENCHMARK.md); run with -m sj_canary as the PR gate",
]
